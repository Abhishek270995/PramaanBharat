<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#138808" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Rounded Square with Indian Flag Gradient Border -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="url(#flagGrad)" filter="url(#glow)" />
  
  <!-- Inner Shield Surface -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#shieldGrad)" />

  <!-- Accent Geometry -->
  <path d="M 50 16 L 76 28 L 76 54 C 76 70 50 82 50 82 C 50 82 24 70 24 54 L 24 28 Z" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.6" />

  <!-- Bold PB Typography -->
  <text x="50" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="-1.5">PB</text>

  <!-- Verification Sparkle Dot -->
  <circle cx="70" cy="30" r="4.5" fill="#38bdf8" />
  <circle cx="70" cy="30" r="2.5" fill="#ffffff" />
</svg>
